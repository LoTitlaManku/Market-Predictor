[project]
name = "stock-market-predictor"
version = "2.0.0"
description = "Predict the stock market."
requires-python = ">=3.12"
dependencies = [
    "bcrypt>=5.0.0",
    "catboost>=1.2.10",
    "cryptography>=46.0.5",
    "db-dtypes>=1.4.4",
    "edgartools>=5.23.2",
    "finplot>=1.9.7",
    "folder-trees>=1.0.0",
    "google-cloud-bigquery>=3.40.1",
    "joblib>=1.5.3",
    "lightgbm>=4.6.0",
    "matplotlib>=3.10.8",
    "matplotlib-venn>=1.1.2",
    "numpy>=2.4.3",
    "optuna>=4.8.0",
    "pandas>=3.0.1",
    "pandas-market-calendars>=5.3.1.2",
    "pandas-stubs~=3.0.3",
    "psutil>=7.2.2",
    "pykalman>=0.11.2",
    "pyqt6>=6.10.2",
    "safetensors>=0.7.0",
    "scikit-learn>=1.8.0",
    "scipy>=1.17.1",
    "seaborn>=0.13.2",
    "skorch>=1.3.1",
    "ta-lib>=0.6.8",
    "time-machine>=3.2.0",
    "torch>=2.11.0",
    "tqdm>=4.67.3",
    "yfinance>=1.2.0",
]

[tool.uv.sources]
folder-trees = { path = "../.custom_packages/folder_trees", editable = true }
